services:
  postgres:
    image: postgres:16-alpine
    container_name: fridgeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fridgeai
      POSTGRES_USER: fridgeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridgeai -d fridgeai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/user-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-user-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/inventory-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
    depends_on:
      postgres:
        condition: service_healthy

  recipe-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/recipe-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-recipe-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      USER_SERVICE_URL: http://user-service:8081
      GENAI_SERVICE_URL: http://genai-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      genai-service:
        condition: service_started

  genai-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/genai-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-genai-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      GENAI_PROVIDER: ${GENAI_PROVIDER:-cloud}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-lg-replace-me}
      LOGOS_BASE_URL: ${LOGOS_BASE_URL:-https://logos.aet.cit.tum.de/v1}
      LOGOS_MODEL: ${LOGOS_MODEL:-openai/gpt-oss-120b}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/client:${IMAGE_TAG:-latest}
    container_name: fridgeai-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - user-service
      - inventory-service
      - recipe-service

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./helm/fridgeai/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

    depends_on:
      - user-service
      - inventory-service
      - recipe-service
      - genai-service

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fridgeai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helm/fridgeai/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus_data:
  grafana_data:
