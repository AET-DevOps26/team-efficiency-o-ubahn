services:
  postgres:
    image: postgres:16-alpine
    container_name: fridgeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fridgeai
      POSTGRES_USER: fridgeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridgeai -d fridgeai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/user-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-user-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/inventory-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
    depends_on:
      postgres:
        condition: service_healthy

  recipe-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/recipe-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-recipe-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fridgeai
      SPRING_DATASOURCE_USERNAME: fridgeai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fridgeai}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForFridgeAIApplicationMin32Ch}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      USER_SERVICE_URL: http://user-service:8081
      GENAI_SERVICE_URL: http://genai-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      genai-service:
        condition: service_started

  genai-service:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/genai-service:${IMAGE_TAG:-latest}
    container_name: fridgeai-genai-service
    restart: unless-stopped
    environment:
      GENAI_PROVIDER: ${GENAI_PROVIDER:-cloud}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-lg-replace-me}
      LOGOS_BASE_URL: ${LOGOS_BASE_URL:-https://logos.aet.cit.tum.de/v1}
      LOGOS_MODEL: ${LOGOS_MODEL:-openai/gpt-oss-120b}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: ghcr.io/aet-devops26/team-efficiency-o-ubahn/client:${IMAGE_TAG:-latest}
    container_name: fridgeai-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - user-service
      - inventory-service
      - recipe-service

volumes:
  postgres-data:
