name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  Server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, inventory-service, recipe-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.service }}
        working-directory: Server
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.service }}:test --no-daemon
      - name: Build ${{ matrix.service }}
        working-directory: Server
        run: ./gradlew :${{ matrix.service }}:bootJar --no-daemon

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install
        working-directory: Client
        run: npm ci
      - name: Build
        working-directory: Client
        run: npm run build

  genai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: GenAI-Service/requirements.txt
      - name: Install
        working-directory: GenAI-Service
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: GenAI-Service
        run: pytest -v
      - name: Smoke check (app imports and boots)
        working-directory: GenAI-Service
        run: python -c "import app.main; print('GenAI service imports OK')"
