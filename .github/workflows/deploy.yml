name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve build SHA
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.sha }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_PRIVATE_KEY }}" | base64 -d > ~/.ssh/azure-vm.pem
          chmod 600 ~/.ssh/azure-vm.pem

      - name: Install Ansible
        run: pip install ansible

      - name: Write Ansible inventory
        run: |
          cat > infrastructure/ansible/inventory.ini << EOF
          [vm]
          ${{ vars.AZURE_PUBLIC_IP }} ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/azure-vm.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          sed -i 's/^[[:space:]]*//' infrastructure/ansible/inventory.ini

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i infrastructure/ansible/inventory.ini \
            infrastructure/ansible/playbook.yml
        env:
          IMAGE_TAG: ${{ steps.ctx.outputs.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          LOGOS_API_KEY: ${{ secrets.LOGOS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
