{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- include "fridgeai.labels" (dict "name" "grafana" "root" $) | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        # Prometheus runs with --web.route-prefix, so its whole API lives
        # under that prefix even for in-cluster requests.
        url: http://prometheus:9090{{ .Values.prometheus.routePrefix }}
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
{{- end }}
