{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fridgeai.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "fridgeai.selectorLabels" (dict "name" $name "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fridgeai.labels" (dict "name" $name "root" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- if $svc.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ include "fridgeai.secretName" $ }}
          {{- end }}
          env:
            {{- if $svc.springDatasource }}
            {{- include "fridgeai.springEnv" $ | nindent 12 }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $svc.probe }}
          startupProbe:
            {{- include "fridgeai.startupProbe" $svc | nindent 12 }}
          readinessProbe:
            {{- include "fridgeai.probe" $svc | nindent 12 }}
          livenessProbe:
            {{- include "fridgeai.probe" $svc | nindent 12 }}
          {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fridgeai.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  selector:
    {{- include "fridgeai.selectorLabels" (dict "name" $name "root" $) | nindent 4 }}
  ports:
    - port: {{ $svc.service.port | default $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
{{- end }}
{{- end }}
