{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {{- include "fridgeai.labels" (dict "name" "prometheus" "root" $) | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'prometheus'
        metrics_path: '{{ .Values.prometheus.routePrefix }}/metrics'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['user-service:8081']

      - job_name: 'recipe-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['recipe-service:8083']

      - job_name: 'inventory-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['inventory-service:8082']

      - job_name: 'genai-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['genai-service:8084']
  alerts.yml: |
{{ .Files.Get "alerts.yml" | indent 4 }}
{{- end }}