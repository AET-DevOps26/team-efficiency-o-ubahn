spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/fridgeai
spring.datasource.username=fridgeai
spring.datasource.password=fridgeai
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=user_service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

jwt.secret=${JWT_SECRET:devSecretKeyForFridgeAIApplicationMin32Ch}

springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/api-docs/user
springdoc.swagger-ui.urls[1].name=inventory-service
springdoc.swagger-ui.urls[1].url=/api-docs/inventory
springdoc.swagger-ui.urls[2].name=recipe-service
springdoc.swagger-ui.urls[2].url=/api-docs/recipe

management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
