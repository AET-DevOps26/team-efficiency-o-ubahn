spring.application.name=recipe-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/fridgeai
spring.datasource.username=fridgeai
spring.datasource.password=fridgeai
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=recipe_service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
jwt.secret=${JWT_SECRET:devSecretKeyForFridgeAIApplicationMin32Ch}
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service:8082}
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
genai.service.url=${GENAI_SERVICE_URL:http://genai-service:8084}

management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
