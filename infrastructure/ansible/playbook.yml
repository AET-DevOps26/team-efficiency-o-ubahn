---
- name: Configure VM and deploy FridgeAI
  hosts: vm
  become: true
  vars:
    app_dir: /opt/fridgeai
    admin_user: azureuser
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    github_actor: "{{ lookup('env', 'GITHUB_ACTOR') }}"
    logos_api_key: "{{ lookup('env', 'LOGOS_API_KEY') }}"

  tasks:
    - name: Validate required environment variables are set
      ansible.builtin.assert:
        that:
          - jwt_secret | length > 0
          - postgres_password | length > 0
          - github_token | length > 0
          - github_actor | length > 0
          - logos_api_key | length > 0
        fail_msg: "Missing required env vars: JWT_SECRET, POSTGRES_PASSWORD, GITHUB_TOKEN, GITHUB_ACTOR, LOGOS_API_KEY"

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0444"
        force: false

    - name: Get system architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Get Ubuntu codename
      ansible.builtin.shell: |
        . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ../../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"

    - name: Copy postgres init scripts
      ansible.builtin.copy:
        src: ../../infra/
        dest: "{{ app_dir }}/infra/"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Create .env file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          IMAGE_TAG={{ image_tag }}
          JWT_SECRET={{ jwt_secret }}
          POSTGRES_PASSWORD={{ postgres_password }}
          LOGOS_API_KEY={{ logos_api_key }}
      no_log: true

    - name: Login to GitHub Container Registry
      ansible.builtin.shell: |
        echo "{{ github_token }}" | docker login ghcr.io -u "{{ github_actor }}" --password-stdin
      no_log: true

    - name: Pull Docker images
      ansible.builtin.shell:
        cmd: docker compose pull
        chdir: "{{ app_dir }}"

    - name: Start services
      ansible.builtin.shell:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
